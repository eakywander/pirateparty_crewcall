<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Crew Call</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Crew Call">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Cinzel:wght@500;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --parchment: #e9d8b4;
    --parchment-dark: #d8c191;
    --ink: #2c1c10;
    --ink-soft: #4a3420;
    --wood: #3c2414;
    --wood-dark: #26150c;
    --gold: #b8862f;
    --gold-bright: #d6a94a;
    --red: #7a2418;
    --panel: #f2e6c8;
    --shadow: rgba(20, 10, 0, 0.35);
    --bg-page: #1a1108;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }

  body {
    font-family: 'Lora', Georgia, 'Times New Roman', serif;
    background:
      radial-gradient(ellipse at 20% 10%, rgba(255, 220, 150, 0.06), transparent 55%),
      radial-gradient(ellipse at 80% 90%, rgba(255, 180, 100, 0.05), transparent 55%),
      var(--bg-page);
    color: var(--parchment);
    min-height: 100%;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    overflow-x: hidden;
  }

  .wrap { max-width: 640px; margin: 0 auto; padding: 32px 18px 56px; }

  header { text-align: center; margin-bottom: 26px; }
  .compass { width: 52px; height: 52px; margin: 0 auto 10px; opacity: 0.85; }
  h1 {
    font-family: 'Pirata One', 'Cinzel', serif;
    font-size: clamp(36px, 8.5vw, 50px);
    margin: 0;
    color: var(--gold-bright);
    letter-spacing: 1px;
    text-shadow: 0 2px 0 rgba(0,0,0,0.4);
    line-height: 1;
  }
  .subtitle {
    font-family: 'Cinzel', serif;
    font-size: 11px;
    letter-spacing: 3px;
    color: #c9b48a;
    margin-top: 9px;
    text-transform: uppercase;
  }

  /* ---------- Join card ---------- */
  .join-card {
    background: linear-gradient(180deg, var(--panel), var(--parchment-dark));
    border-radius: 14px;
    padding: 24px 20px 22px;
    box-shadow: 0 14px 34px var(--shadow), inset 0 0 0 1px rgba(255,255,255,0.15);
    border: 1px solid var(--wood-dark);
    position: relative;
  }
  .join-card::before {
    content: "";
    position: absolute;
    inset: 8px;
    border: 1.5px dashed rgba(60, 36, 20, 0.35);
    border-radius: 8px;
    pointer-events: none;
  }
  label.field-label {
    display: block;
    font-family: 'Cinzel', serif;
    font-size: 12px;
    letter-spacing: 2px;
    color: var(--ink-soft);
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .input-row { display: flex; gap: 10px; }
  input[type="text"] {
    flex: 1;
    min-width: 0;
    font-family: 'Lora', serif;
    font-size: 18px;
    padding: 13px 15px;
    border-radius: 9px;
    border: 2px solid var(--wood-dark);
    background: #fbf3dd;
    color: var(--ink);
    outline: none;
  }
  input[type="text"]:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(184, 134, 47, 0.28); }
  input[type="text"]::placeholder { color: #a4906a; }

  button.join-btn {
    font-family: 'Cinzel', serif;
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: #fff2d9;
    background: linear-gradient(180deg, var(--red), var(--wood-dark));
    border: none;
    border-radius: 9px;
    padding: 0 20px;
    cursor: pointer;
    box-shadow: 0 4px 0 #401009, 0 6px 14px rgba(0,0,0,0.35);
    transition: transform 0.08s ease, box-shadow 0.08s ease;
    white-space: nowrap;
  }
  button.join-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #401009, 0 2px 6px rgba(0,0,0,0.35); }
  button.join-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  .hint { font-size: 13px; color: var(--ink-soft); margin-top: 10px; font-style: italic; }
  .error-msg { font-family: 'Lora', serif; font-size: 14px; color: var(--red); margin-top: 10px; min-height: 18px; }

  /* ---------- Reveal ---------- */
  .reveal-overlay {
    position: fixed; inset: 0;
    background: rgba(10, 5, 2, 0.88);
    display: flex; align-items: center; justify-content: center;
    padding: 22px; z-index: 50;
    opacity: 0; pointer-events: none;
    transition: opacity 0.25s ease;
    overflow-y: auto;
  }
  .reveal-overlay.show { opacity: 1; pointer-events: auto; }
  .reveal-card {
    width: 100%; max-width: 420px; text-align: center;
    background: linear-gradient(180deg, var(--panel), var(--parchment-dark));
    border-radius: 18px;
    padding: 30px 24px 26px;
    box-shadow: 0 24px 60px rgba(0,0,0,0.55);
    border: 2px solid var(--wood-dark);
    transform: scale(0.82) translateY(14px);
    transition: transform 0.32s cubic-bezier(.2,.9,.25,1.2);
    margin: auto;
  }
  .reveal-overlay.show .reveal-card { transform: scale(1) translateY(0); }
  .reveal-eyebrow {
    font-family: 'Cinzel', serif; font-size: 11px; letter-spacing: 3px;
    text-transform: uppercase; color: var(--ink-soft); margin-bottom: 6px;
  }
  .reveal-name { font-family: 'Lora', serif; font-style: italic; font-size: 19px; color: var(--ink); margin-bottom: 16px; }
  .reveal-crest { width: 120px; height: 120px; margin: 0 auto 12px; display: flex; align-items: center; justify-content: center; }
  .crest-fill { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
  .crest-fill svg, .crest-fill img { width: 100%; height: 100%; display: block; object-fit: contain; margin: 0 auto; }
  .reveal-crew { font-family: 'Pirata One', serif; font-size: 30px; margin: 0 0 4px; line-height: 1.05; }
  .reveal-crew-tag { font-family: 'Lora', serif; font-style: italic; font-size: 13px; color: var(--ink-soft); margin-bottom: 18px; }

  .reveal-divider { width: 60%; margin: 0 auto 16px; border: none; border-top: 1.5px dashed rgba(60,36,20,0.35); }

  .reveal-char-eyebrow {
    font-family: 'Cinzel', serif; font-size: 10px; letter-spacing: 2.5px;
    text-transform: uppercase; color: var(--ink-soft); margin-bottom: 10px;
  }
  .reveal-char-portrait {
    width: 96px; height: 96px; border-radius: 50%;
    margin: 0 auto 10px; overflow: hidden;
    border: 3px solid var(--wood-dark);
    display: flex; align-items: center; justify-content: center;
    background: var(--char-bg, #999);
  }
  .reveal-char-portrait img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .reveal-char-portrait .initials { font-family: 'Pirata One', serif; font-size: 34px; color: #fff; }
  .reveal-char-name { font-family: 'Cinzel', serif; font-weight: 700; font-size: 19px; color: var(--ink); margin-bottom: 6px; }
  .reveal-char-blurb { font-family: 'Lora', serif; font-style: italic; font-size: 14px; color: var(--ink-soft); margin-bottom: 22px; padding: 0 6px; }

  .reveal-close {
    font-family: 'Cinzel', serif; font-size: 13px; letter-spacing: 1.5px; text-transform: uppercase;
    color: #fff2d9; background: var(--wood); border: none; border-radius: 8px; padding: 12px 26px; cursor: pointer;
  }

  /* ---------- Roster ---------- */
  .roster-toggle {
    display: block; width: 100%; text-align: center; background: none; border: none;
    color: #d8c191; font-family: 'Cinzel', serif; font-size: 12px; letter-spacing: 2px;
    text-transform: uppercase; padding: 20px 0 6px; cursor: pointer;
  }
  .roster-toggle .chev { display: inline-block; margin-left: 6px; transition: transform 0.2s ease; }
  .roster-toggle.open .chev { transform: rotate(180deg); }

  .roster { display: none; margin-top: 10px; gap: 14px; grid-template-columns: 1fr 1fr; }
  .roster.open { display: grid; }
  @media (max-width: 460px) { .roster { grid-template-columns: 1fr; } }

  .crew-panel { background: rgba(242, 230, 200, 0.06); border: 1px solid rgba(216, 193, 145, 0.28); border-radius: 12px; padding: 14px 14px 12px; }
  .crew-panel-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .crew-panel-crest { width: 34px; height: 34px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
  .crew-panel-crest svg, .crew-panel-crest img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .crew-panel-name { font-family: 'Pirata One', serif; font-size: 18px; line-height: 1.1; }
  .crew-panel-count { font-family: 'Cinzel', serif; font-size: 10px; letter-spacing: 1px; color: #b7a377; }

  .crew-members { list-style: none; margin: 0; padding: 0; font-family: 'Lora', serif; font-size: 14px; color: #ecdfbf; }
  .crew-members li { display: flex; align-items: center; gap: 8px; padding: 5px 0; border-top: 1px dashed rgba(216, 193, 145, 0.18); }
  .crew-members li:first-child { border-top: none; }
  .mini-portrait {
    width: 24px; height: 24px; border-radius: 50%; flex-shrink: 0; overflow: hidden;
    display: flex; align-items: center; justify-content: center; background: var(--mbg, #999);
  }
  .mini-portrait img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .mini-portrait .initials { font-family: 'Cinzel', serif; font-size: 10px; color: #fff; }
  .member-name { flex-shrink: 0; }
  .member-char { color: #b7a377; font-style: italic; font-size: 12.5px; }
  .crew-empty { font-style: italic; font-size: 13px; color: #8a7a58; }

  /* ---------- Host / settings controls ---------- */
  .host-controls { text-align: center; margin-top: 28px; display: flex; flex-direction: column; gap: 4px; align-items: center; }
  .text-link {
    background: none; border: none; color: #7a6644; font-family: 'Lora', serif; font-size: 12px;
    font-style: italic; text-decoration: underline; cursor: pointer; padding: 7px;
  }
  .confirm-box { margin-top: 6px; font-size: 13px; color: #d8c191; text-align: center; }
  .confirm-box button {
    font-family: 'Cinzel', serif; font-size: 11px; letter-spacing: 1px; text-transform: uppercase;
    padding: 6px 12px; margin: 6px 4px 0; border-radius: 6px; border: 1px solid var(--wood-dark); cursor: pointer;
  }
  .confirm-yes { background: var(--red); color: #fff2d9; }
  .confirm-no { background: #2b1c0f; color: #d8c191; }

  /* ---------- Settings modal ---------- */
  .settings-overlay {
    position: fixed; inset: 0; background: rgba(10,5,2,0.9); z-index: 60;
    display: flex; align-items: flex-start; justify-content: center;
    padding: 0; opacity: 0; pointer-events: none; transition: opacity 0.2s ease;
    overflow-y: auto;
  }
  .settings-overlay.show { opacity: 1; pointer-events: auto; }
  .settings-panel {
    width: 100%; max-width: 640px; min-height: 100%;
    background: var(--bg-page);
    padding: 20px 18px calc(50px + env(safe-area-inset-bottom, 0px));
  }
  .settings-head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 18px; padding-top: env(safe-area-inset-top, 0px);
  }
  .settings-title { font-family: 'Pirata One', serif; font-size: 28px; color: var(--gold-bright); }
  .settings-done {
    font-family: 'Cinzel', serif; font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase;
    background: var(--wood); color: #fff2d9; border: none; border-radius: 8px; padding: 10px 18px; cursor: pointer;
  }
  .settings-crew-block {
    background: rgba(242, 230, 200, 0.06); border: 1px solid rgba(216, 193, 145, 0.28);
    border-radius: 12px; padding: 16px 14px; margin-bottom: 16px;
  }
  .settings-crew-head { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  .upload-slot { position: relative; width: 56px; height: 56px; flex-shrink: 0; }
  .upload-slot .thumb {
    width: 56px; height: 56px; border-radius: 50%; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    background: var(--tbg, #555); border: 2px solid var(--wood-dark);
  }
  .upload-slot .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .upload-slot .thumb .initials { font-family: 'Pirata One', serif; font-size: 20px; color: #fff; }
  .upload-slot input[type="file"] {
    position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%;
  }
  .settings-crew-name { font-family: 'Pirata One', serif; font-size: 22px; }
  .settings-crew-actions { margin-left: auto; display: flex; flex-direction: column; gap: 4px; align-items: flex-end; }
  .tiny-btn {
    font-family: 'Cinzel', serif; font-size: 10px; letter-spacing: 1px; text-transform: uppercase;
    background: none; border: 1px solid rgba(216,193,145,0.4); color: #d8c191;
    border-radius: 6px; padding: 4px 8px; cursor: pointer;
  }
  .char-row { display: flex; align-items: center; gap: 12px; padding: 8px 0; border-top: 1px dashed rgba(216, 193, 145, 0.18); }
  .char-row:first-of-type { border-top: 1px solid rgba(216, 193, 145, 0.3); margin-top: 4px; padding-top: 12px; }
  .char-row-name { font-family: 'Lora', serif; font-weight: 600; font-size: 14.5px; color: #ecdfbf; }
  .char-row-blurb { font-family: 'Lora', serif; font-style: italic; font-size: 12px; color: #a99872; }
  .char-row-actions { margin-left: auto; }

  .settings-note {
    font-family: 'Lora', serif; font-style: italic; font-size: 12.5px; color: #a99872;
    text-align: center; margin: 4px 0 20px; line-height: 1.5;
  }

  ::selection { background: var(--gold); color: var(--ink); }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <svg class="compass" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <g fill="none" stroke="#d6a94a" stroke-width="2.5">
        <circle cx="50" cy="50" r="42"/>
        <circle cx="50" cy="50" r="34" stroke-width="1"/>
        <path d="M50 12 L57 50 L50 88 L43 50 Z" fill="#7a2418" stroke="none"/>
        <path d="M12 50 L50 43 L88 50 L50 57 Z" fill="#3c2414" stroke="none"/>
        <circle cx="50" cy="50" r="3.5" fill="#d6a94a" stroke="none"/>
      </g>
    </svg>
    <h1>Crew Call</h1>
    <div class="subtitle">Step up &amp; find your flag</div>
  </header>

  <div class="join-card">
    <label class="field-label" for="nameInput">Your name, pirate</label>
    <div class="input-row">
      <input id="nameInput" type="text" placeholder="e.g. Sasha" maxlength="24" autocomplete="off" autocapitalize="words">
      <button class="join-btn" id="joinBtn">Set Sail</button>
    </div>
    <div class="error-msg" id="errorMsg"></div>
    <div class="hint">One tap, one crew, one character. No take-backs.</div>
  </div>

  <button class="roster-toggle" id="rosterToggle">Show all crews <span class="chev">▾</span></button>
  <div class="roster" id="roster"></div>

  <div class="host-controls">
    <button class="text-link" id="resetLink">Host: clear all crews &amp; start over</button>
    <div class="confirm-box" id="confirmBox" style="display:none;">
      This wipes every name from every crew. Sure?
      <div>
        <button class="confirm-yes" id="confirmYes">Yes, clear it</button>
        <button class="confirm-no" id="confirmNo">Cancel</button>
      </div>
    </div>
  </div>
</div>

<div class="reveal-overlay" id="revealOverlay">
  <div class="reveal-card">
    <div class="reveal-eyebrow">Welcome aboard</div>
    <div class="reveal-name" id="revealName"></div>
    <div class="reveal-crest" id="revealCrest"></div>
    <div class="reveal-crew" id="revealCrew"></div>
    <div class="reveal-crew-tag" id="revealCrewTag"></div>
    <hr class="reveal-divider">
    <div class="reveal-char-eyebrow">You are</div>
    <div class="reveal-char-portrait" id="revealCharPortrait"></div>
    <div class="reveal-char-name" id="revealCharName"></div>
    <div class="reveal-char-blurb" id="revealCharBlurb"></div>
    <button class="reveal-close" id="revealClose">Take Your Seat</button>
  </div>
</div>

<script>

  "use strict";

  var STORAGE_KEY = "crewCall.selfhost";

  // ---------------- crew + character data ----------------

    {

        );
      },
      characters: [
        { id: "whitebeard", name: "Edward Newgate", blurb: "Captain. The strongest man alive." },

    },
    {
      id: "bigmom",

      tagline: "Eats emotions. And everything else.",
      colorA: "#b3407e", colorB: "#7a1f52",
      crest: function () {
        return svgCrest(
          '<path d="M30 22 Q24 10 34 8 Q30 16 36 20" fill="none" stroke="#b3407e" stroke-width="4" stroke-linecap="round"/>' +
          '<path d="M70 22 Q76 10 66 8 Q70 16 64 20" fill="none" stroke="#b3407e" stroke-width="4" stroke-linecap="round"/>' +

          '<ellipse cx="60" cy="44" rx="4.2" ry="6" fill="#2c1c10"/>' +
          '<path d="M50 50 L46.5 59 L53.5 59 Z" fill="#2c1c10"/>' +
          '<path d="M40 66 Q50 74 60 66" stroke="#b3407e" stroke-width="4" fill="none" stroke-linecap="round"/>' +
          '<line x1="10" y1="88" x2="50" y2="62" stroke="#2c1c10" stroke-width="4.5" stroke-linecap="round"/>' +
          '<line x1="90" y1="88" x2="50" y2="62" stroke="#2c1c10" stroke-width="4.5" stroke-linecap="round"/>'
        );
      },
      characters: [
        { id: "linlin", name: "Charlotte Linlin", blurb: "Captain, \u201cBig Mom.\u201d Eats emotions. And everything else." },
        { id: "katakuri", name: "Charlotte Katakuri", blurb: "Sweet Commander. Never lets anyone see him eat." },
        { id: "smoothie", name: "Charlotte Smoothie", blurb: "Sweet Commander. Squeezes enemies dry. Literally." },
        { id: "cracker", name: "Charlotte Cracker", blurb: "Sweet Commander. Biscuit soldiers, unshakeable pride." },
        { id: "perospero", name: "Charlotte Perospero", blurb: "Sweet Commander. Candy-coated and calculating." }
      ]
    },
    {
      id: "roger",
      name: "Roger Pirates",
      tagline: "The crew that found Laugh Tale.",
      colorA: "#c9a227", colorB: "#1f1f1f",
      crest: function () {
        return svgCrest(
          '<path d="M40 18 L44 8 L50 16 L56 8 L60 18 Z" fill="#c9a227" stroke="#1f1f1f" stroke-width="1.5"/>' +
          '<circle cx="50" cy="46" r="27" fill="#f2e6c8" stroke="#2c1c10" stroke-width="1.5"/>' +
          '<ellipse cx="40" cy="44" rx="4.2" ry="6" fill="#2c1c10"/>' +
          '<ellipse cx="60" cy="44" rx="4.2" ry="6" fill="#2c1c10"/>' +
          '<path d="M50 50 L46.5 59 L53.5 59 Z" fill="#2c1c10"/>' +
          '<path d="M36 64 Q50 72 64 64" stroke="#2c1c10" stroke-width="2.5" fill="none" stroke-linecap="round"/>' +
          '<line x1="8" y1="88" x2="50" y2="60" stroke="#2c1c10" stroke-width="4.5" stroke-linecap="round"/>' +
          '<line x1="92" y1="88" x2="50" y2="60" stroke="#2c1c10" stroke-width="4.5" stroke-linecap="round"/>'
        );
      },
      characters: [
        { id: "roger", name: "Gol D. Roger", blurb: "Captain. Pirate King. Started all this trouble." },
        { id: "rayleigh", name: "Silvers Rayleigh", blurb: "First mate. \u201cDark King,\u201d retired but not really." },
        { id: "buggy", name: "Buggy", blurb: "Navigator (allegedly). Splits into pieces, personality included." },
        { id: "shanks", name: "Shanks", blurb: "Cabin boy turned legend. Lost an arm, kept the smile." },
        { id: "crocus", name: "Crocus", blurb: "Ship's doctor. Whale-sized patience required." }
      ]
    }
  ];

  var CREW_BY_ID = {};
  CREWS.forEach(function (c) { CREW_BY_ID[c.id] = c; });

  function charById(crewId, charId) {
    var crew = CREW_BY_ID[crewId];
    if (!crew) return null;
    for (var i = 0; i < crew.characters.length; i++) {
      if (crew.characters[i].id === charId) return crew.characters[i];
    }
    return null;
  }

  function initials(name) {
    var parts = name.trim().split(/\s+/);
    if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
    return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
  }

  function svgCrest(innerGroup) {
    return '<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">' + innerGroup + '</svg>';
  }

  // ---------------- storage ----------------

  function loadState() {
    try {
      var raw = window.localStorage.getItem(STORAGE_KEY);
      if (!raw) return { members: [] };
      var parsed = JSON.parse(raw);
      if (!parsed || !Array.isArray(parsed.members)) parsed = { members: [] };
      return parsed;
    } catch (e) {
      return { members: [] };
    }
  }

  function saveState() {
    try {
      window.localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (e) {
      console.warn("Could not save — storage may be full.", e);
    }
  }

  var state = loadState();

  // ---------------- photos from files ----------------
  // Put photos next to index.html named e.g. "strawhat-flag.jpg" or
  // "strawhat-luffy.png". Missing photos fall back to the built-in art.
  var EXTS = [".jpg", ".jpeg", ".png", ".webp", ".heic", ".JPG", ".JPEG", ".PNG", ".HEIC"];
  var goodSrc = {};   // base -> working src
  var missing = {};   // base -> true once every extension failed

  function loadPhotoInto(wrap, base, alt) {
    if (missing[base]) return;
    var img = new Image();
    img.alt = alt;
    function show() { wrap.innerHTML = ""; wrap.appendChild(img); }
    if (goodSrc[base]) { img.onload = show; img.src = goodSrc[base]; return; }
    var i = 0;
    img.onload = function () { goodSrc[base] = img.src; show(); };
    img.onerror = function () {
      i++;
      if (i < EXTS.length) img.src = base + EXTS[i];
      else missing[base] = true;
    };
    img.src = base + EXTS[0];
  }

  // ---------------- assignment logic ----------------

  function membersOf(crewId) {
    return state.members.filter(function (m) { return m.crewId === crewId; });
  }

  function countsByCrew() {
    var counts = {};
    CREWS.forEach(function (c) { counts[c.id] = membersOf(c.id).length; });
    return counts;
  }

  function crewCapacity(crew) { return crew.characters.length; }

  function pickCrewId() {
    var counts = countsByCrew();
    var open = CREWS.filter(function (c) { return counts[c.id] < crewCapacity(c); });
    if (open.length === 0) return null;
    var min = Math.min.apply(null, open.map(function (c) { return counts[c.id]; }));
    var candidates = open.filter(function (c) { return counts[c.id] === min; });
    return candidates[Math.floor(Math.random() * candidates.length)].id;
  }

  function pickCharacterId(crewId) {
    var crew = CREW_BY_ID[crewId];
    var used = membersOf(crewId).map(function (m) { return m.characterId; });
    var available = crew.characters.filter(function (ch) { return used.indexOf(ch.id) === -1; });
    if (available.length === 0) return null;
    return available[Math.floor(Math.random() * available.length)].id;
  }

  function allCrewsFull() {
    var counts = countsByCrew();
    return CREWS.every(function (c) { return counts[c.id] >= crewCapacity(c); });
  }

  function nameTaken(name) {
    var norm = name.trim().toLowerCase();
    return state.members.some(function (m) { return m.name.trim().toLowerCase() === norm; });
  }

  // ---------------- rendering: crest / portrait helpers ----------------

  function crestNode(crew, sizeClass) {
    var wrap = document.createElement("div");
    if (sizeClass) wrap.className = sizeClass;
    wrap.innerHTML = crew.crest();
    loadPhotoInto(wrap, crew.id + "-flag", crew.name);
    return wrap;
  }

  function portraitNode(crew, character, sizeClass) {
    var wrap = document.createElement("div");
    if (sizeClass) wrap.className = sizeClass;
    wrap.style.setProperty("--mbg", crew.colorA);
    wrap.style.setProperty("--char-bg", crew.colorA);
    var ini = document.createElement("div");
    ini.className = "initials";
    ini.textContent = initials(character.name);
    wrap.appendChild(ini);
    loadPhotoInto(wrap, crew.id + "-" + character.id, character.name);
    return wrap;
  }

  // ---------------- roster rendering ----------------

  var rosterEl = document.getElementById("roster");
  var rosterToggle = document.getElementById("rosterToggle");
  var rosterOpen = false;

  function renderRoster() {
    var counts = countsByCrew();
    rosterEl.innerHTML = "";
    CREWS.forEach(function (crew) {
      var panel = document.createElement("div");
      panel.className = "crew-panel";

      var head = document.createElement("div");
      head.className = "crew-panel-head";
      head.appendChild(crestNode(crew, "crew-panel-crest"));

      var nameWrap = document.createElement("div");
      var nameEl = document.createElement("div");
      nameEl.className = "crew-panel-name";
      nameEl.style.color = crew.colorA;
      nameEl.textContent = crew.name;
      var countEl = document.createElement("div");
      countEl.className = "crew-panel-count";
      var cap = crewCapacity(crew);
      countEl.textContent = counts[crew.id] + " / " + cap + (counts[crew.id] >= cap ? "  \u2013  FULL" : " PIRATES");
      nameWrap.appendChild(nameEl);
      nameWrap.appendChild(countEl);
      head.appendChild(nameWrap);
      panel.appendChild(head);

      var members = membersOf(crew.id);
      if (members.length === 0) {
        var empty = document.createElement("div");
        empty.className = "crew-empty";
        empty.textContent = "No one yet";
        panel.appendChild(empty);
      } else {
        var list = document.createElement("ul");
        list.className = "crew-members";
        members.forEach(function (m) {
          var li = document.createElement("li");
          var ch = charById(crew.id, m.characterId);
          if (ch) li.appendChild(portraitNode(crew, ch, "mini-portrait"));
          var nm = document.createElement("span");
          nm.className = "member-name";
          nm.textContent = m.name;
          li.appendChild(nm);
          if (ch) {
            var cn = document.createElement("span");
            cn.className = "member-char";
            cn.textContent = "\u2014 " + ch.name;
            li.appendChild(cn);
          }
          list.appendChild(li);
        });
        panel.appendChild(list);
      }
      rosterEl.appendChild(panel);
    });
  }

  rosterToggle.addEventListener("click", function () {
    rosterOpen = !rosterOpen;
    rosterEl.classList.toggle("open", rosterOpen);
    rosterToggle.classList.toggle("open", rosterOpen);
    rosterToggle.firstChild.textContent = rosterOpen ? "Hide all crews " : "Show all crews ";
  });

  // ---------------- join flow ----------------

  var nameInput = document.getElementById("nameInput");
  var joinBtn = document.getElementById("joinBtn");
  var errorMsg = document.getElementById("errorMsg");

  var overlay = document.getElementById("revealOverlay");
  var revealName = document.getElementById("revealName");
  var revealCrest = document.getElementById("revealCrest");
  var revealCrew = document.getElementById("revealCrew");
  var revealCrewTag = document.getElementById("revealCrewTag");
  var revealCharPortrait = document.getElementById("revealCharPortrait");
  var revealCharName = document.getElementById("revealCharName");
  var revealCharBlurb = document.getElementById("revealCharBlurb");
  var revealClose = document.getElementById("revealClose");

  function updateJoinAvailability() {
    if (allCrewsFull()) {
      nameInput.disabled = true;
      joinBtn.disabled = true;
      nameInput.placeholder = "All crews are full";
    } else {
      nameInput.disabled = false;
      joinBtn.disabled = false;
      nameInput.placeholder = "e.g. Sasha";
    }
  }

  function doJoin() {
    var name = nameInput.value.trim();
    errorMsg.textContent = "";

    if (allCrewsFull()) {
      errorMsg.textContent = "Every crew is full \u2014 all four ships have sailed.";
      return;
    }
    if (!name) {
      errorMsg.textContent = "Even ghosts need a name to board.";
      return;
    }
    if (name.length > 24) name = name.slice(0, 24);
    if (nameTaken(name)) {
      errorMsg.textContent = "That name already sailed. Try a nickname?";
      return;
    }

    var crewId = pickCrewId();
    if (!crewId) {
      errorMsg.textContent = "Every crew is full \u2014 all four ships have sailed.";
      updateJoinAvailability();
      return;
    }
    var characterId = pickCharacterId(crewId);
    if (!characterId) {
      errorMsg.textContent = "That crew just ran out of characters \u2014 try again.";
      renderRoster();
      updateJoinAvailability();
      return;
    }

    state.members.push({ name: name, crewId: crewId, characterId: characterId });
    saveState();
    renderRoster();
    updateJoinAvailability();

    var crew = CREW_BY_ID[crewId];
    var character = charById(crewId, characterId);

    revealName.textContent = name;
    revealCrest.innerHTML = "";
    revealCrest.appendChild(crestNode(crew, "crest-fill"));
    revealCrew.textContent = crew.name;
    revealCrew.style.color = crew.colorA;
    revealCrewTag.textContent = crew.tagline;

    revealCharPortrait.innerHTML = "";
    revealCharPortrait.style.setProperty("--char-bg", crew.colorA);
    var ini = document.createElement("div");
    ini.className = "initials";
    ini.textContent = initials(character.name);
    revealCharPortrait.appendChild(ini);
    loadPhotoInto(revealCharPortrait, crewId + "-" + characterId, character.name);
    revealCharName.textContent = character.name;
    revealCharName.style.color = crew.colorA;
    revealCharBlurb.textContent = character.blurb;

    overlay.classList.add("show");
    nameInput.value = "";
  }

  joinBtn.addEventListener("click", doJoin);
  nameInput.addEventListener("keydown", function (e) { if (e.key === "Enter") doJoin(); });

  revealClose.addEventListener("click", function () {
    overlay.classList.remove("show");
    nameInput.focus();
  });
  overlay.addEventListener("click", function (e) { if (e.target === overlay) overlay.classList.remove("show"); });

  // ---------------- host reset ----------------

  var resetLink = document.getElementById("resetLink");
  var confirmBox = document.getElementById("confirmBox");
  var confirmYes = document.getElementById("confirmYes");
  var confirmNo = document.getElementById("confirmNo");

  resetLink.addEventListener("click", function () { confirmBox.style.display = "block"; });
  confirmNo.addEventListener("click", function () { confirmBox.style.display = "none"; });
  confirmYes.addEventListener("click", function () {
    state.members = [];
    saveState();
    renderRoster();
    updateJoinAvailability();
    confirmBox.style.display = "none";
  });

  // ---------------- init ----------------

  renderRoster();
  updateJoinAvailability();
  nameInput.focus();
})();
</script>
